# Regulus facts.yaml — DESIGN.md §10.2
# The rates, thresholds, deadlines, and section numbers that questions turn on.
# Every fact is grounded in a content-addressed chunk id from sources/enriched/
# (verified 2026-11-09 via scripts/eval-validate.ts).
#
# Rules:
#   - `chunks` lists the passage(s) that prove the fact. Eval cases referencing
#     this fact must cite at least one of them (Recall@k target).
#   - `expected` values are exact-match strings for the deterministic evaluator
#     (normalized: lowercase, strip punctuation/units where noted).
#   - If a source is re-fetched and its hash changes, chunk ids change and
#     validation FAILS — re-verify facts before re-running evals.
#
# Known corpus conflicts are FEATURED, not hidden (§19 risk 4): where the old
# act, the new act, and GRA guidance disagree, each carries its own fact entry
# and the eval case tests that the system surfaces the conflict rather than
# picking silently.

facts:

  # --- VAT rate ---------------------------------------------------------------
  - id: vat-rate-standard
    label: Standard VAT rate
    value: "15%"
    expected: ["15 percent", "15%", "fifteen percent", "fifteen per cent"]
    chunks:
      - vat-act-2025-act-1151:209a8c58:4
      - vat-act-2013-act-870:32aa74aa:3
    note: >-
      Both VAT acts set 15%. Act 1151 s.3 (2025) is current; Act 870 s.3 (2013)
      says the same. Citing either is acceptable; citing Act 1151 preferred.

  - id: vat-rate-flat-scheme
    label: VAT flat rate scheme (wholesalers of goods)
    value: "3%"
    expected: ["3 percent", "3%", "three percent"]
    chunks:
      - practice-note-vat-flat-rate:00b75aa0:14
      - practice-note-vat-flat-rate:00b75aa0:15
    note: GRA Practice Note on the VAT Flat Rate Scheme — marginal VAT&NHIL rate.

  # --- VAT registration threshold (THE conflict) ------------------------------
  - id: vat-registration-threshold-870
    label: VAT registration threshold — Act 870 (2013, superseded in part)
    value: "GHS 120,000 in 12 months (or GHS 30,000 in 3 months)"
    expected: ["120,000", "one hundred and twenty thousand"]
    chunks:
      - vat-act-2013-act-870:32aa74aa:6
    note: Act 870 s.6 — the OLD threshold. Superseded by Act 1151 s.6.

  - id: vat-registration-threshold-1151
    label: VAT registration threshold — Act 1151 (2025, current for goods)
    value: "GHS 750,000 in 12 months (or GHS 187,500 in 3 months)"
    expected: ["750,000", "seven hundred and fifty thousand"]
    chunks:
      - vat-act-2025-act-1151:209a8c58:8
    note: >-
      Act 1151 s.6(1)(b) goods threshold 750,000; s.6(2)(a) three-month
      threshold 187,500 (both in the same chunk, spanning a page break).
      Services register within 30 days regardless of threshold (same chunk).

  - id: vat-registration-services-30-days
    label: VAT registration for taxable supplies of SERVICES
    value: "Register within 30 days of engaging in the activity — no threshold"
    expected: ["thirty days", "30 days"]
    chunks:
      - vat-act-2025-act-1151:209a8c58:8
    note: Act 1151 s.6(1)(a) — services have NO turnover threshold.

  - id: vat-registration-threshold-gra-faq
    label: VAT registration threshold as stated by GRA's public FAQ
    value: "GHS 200,000"
    expected: ["200,000"]
    chunks: []
    note: >-
      NOT IN CORPUS — recorded so eval authors know GRA's website says
      200,000 while the corpus acts say 120,000 (Act 870) and 750,000
      (Act 1151). A correct system answering from corpus must present the
      act figures and may flag that guidance differs; it must not invent
      200,000 from nothing.

