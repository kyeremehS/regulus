  # --- Absence facts (ground truth for abstention cases) ----------------------
  - id: absence-tax-objection-procedure
    label: Tax assessment objection procedure
    value: ABSENT
    expected: []
    chunks: []
    note: >-
      Verified absent 2026-11-09: no "notice of objection"/"Tax Appeals
      Tribunal" text exists in any of the 9 corpus docs (objection hits in
      Act 870/992 are unrelated cross-references). The procedure lives in the
      Tax Administration Act, which is NOT in the corpus. Correct behavior:
      abstain — "not found in sources" — never invent the 30-day rule.
